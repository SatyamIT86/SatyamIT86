name: Update Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"      # regenerates daily at midnight UTC
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SatyamIT86
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata

          # Rich visuals in place of the old separate widgets
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_colors: github

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full

          plugin_lines: yes

          # Achievements plugin scrapes the GitHub profile page and is
          # known to be flaky ("Unexpected error"). Leave it off for now —
          # can re-enable later by setting this to `yes`.
          plugin_achievements: no
